name: Build Dylib

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Tự động hủy job cũ nếu có code mới push (chống kẹt Queued)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cấp quyền tối thiểu cho bảo mật
permissions:
  contents: read

jobs:
  build:
    name: Build iOS Dylib (arm64)
    runs-on: macos-14  # Cố định bản macOS 14 (Apple Silicon, nhanh hơn macos-latest)
    timeout-minutes: 20

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Chỉ lấy commit mới nhất để checkout nhanh hơn

      # 2. Cache Theos SDK và build artifacts (giúp lần sau build cực nhanh)
      - name: Cache Theos SDK
        uses: actions/cache@v4
        with:
          path: |
            $HOME/theos/sdks
            $HOME/theos/lib
          key: theos-sdk-${{ runner.os }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            theos-sdk-${{ runner.os }}-

      # 3. Setup Theos
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      # 4. Chuẩn bị thư mục build (xử lý dấu cách trong tên thư mục)
      - name: Prepare Build Directory
        run: |
          set -e
          echo "::group::Prepare temp_build"
          rm -rf temp_build
          mkdir -p temp_build
          cp -R "intex dylib/"* temp_build/
          find temp_build -name "control" -exec perl -pi -e 's/\r//g' {} \; || true
          echo "::endgroup::"

      # 5. Build Dylib
      - name: Build Dylib
        working-directory: ./temp_build
        env:
          CFLAGS: "-Wl,-U,___isPlatformVersionAtLeast"
          TARGET: iphone:clang:16.5:13.0
          ARCHS: arm64
        run: |
          set -e
          echo "::group::Clean"
          make clean || true
          echo "::endgroup::"

          echo "::group::Build"
          make -j$(sysctl -n hw.ncpu) FINALPACKAGE=1
          echo "::endgroup::"

      # 6. Kiểm tra file dylib có tồn tại không
      - name: Verify Dylib
        working-directory: ./temp_build
        run: |
          set -e
          DYLIB=$(find .theos/obj/arm64 -name "*.dylib" | head -n 1)
          if [ -z "$DYLIB" ]; then
            echo "❌ Không tìm thấy file .dylib! Build thất bại."
            find .theos -type f || true
            exit 1
          fi
          echo "✅ Tìm thấy: $DYLIB"
          ls -lh "$DYLIB"
          file "$DYLIB"

      # 7. Upload artifact
      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSViet-Dylib-arm64-${{ github.sha }}
          path: temp_build/.theos/obj/arm64/*.dylib
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      # 8. Dọn dẹp (luôn chạy kể cả khi fail)
      - name: Cleanup
        if: always()
        run: rm -rf temp_build
